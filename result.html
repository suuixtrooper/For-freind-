<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaaahhhh!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* അതിവേഗ സ്ട്രോബ് ഫ്ലാഷ് */
    @keyframes seizureStrobe {
      0%   { background-color: #ffffff; }
      12%  { background-color: #ff0000; }
      25%  { background-color: #ffffff; }
      37%  { background-color: #00ff00; }
      50%  { background-color: #ffffff; }
      62%  { background-color: #0000ff; }
      75%  { background-color: #ffff00; }
      87%  { background-color: #ffffff; }
      100% { background-color: #ff00ff; }
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      animation: seizureStrobe 0.04s infinite;
      overflow: hidden;
      cursor: pointer;
    }

    /* വലിയ Aaaahhhh വാചകം */
    .shout-text {
      font-size: clamp(65px, 20vw, 180px);
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 6px;
      text-shadow: 
        0 0 20px #ff0000,
        0 0 40px #00ffff,
        0 0 70px #ffffff,
        0 0 100px #ff00ff;
      animation: crazyVibrate 0.06s infinite alternate;
      text-align: center;
      user-select: none;
      line-height: 1;
    }

    @keyframes crazyVibrate {
      0%   { transform: translate(8px, -8px) scale(1.1) rotate(-3deg); }
      50%  { transform: translate(-8px, 8px) scale(0.9) rotate(3deg); }
      100% { transform: translate(-6px, -6px) scale(1.15) rotate(0deg); }
    }

    /* Aaaahhhh-ന് തൊട്ടുതാഴെയുള്ള ക്രെഡിറ്റ്സ് */
    .credit-badge {
      margin-top: 35px;
      font-size: 15px;
      font-weight: 900;
      color: #000;
      background: #ffffff;
      padding: 10px 24px;
      border-radius: 30px;
      letter-spacing: 1.5px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
      user-select: none;
      text-transform: lowercase;
    }
  </style>
</head>
<body>

  <div class="shout-text">Aaaahhhh!</div>
  <div class="credit-badge">created by state_.trooper</div>

  <!-- ബാക്ക്ഗ്രൗണ്ടിൽ പ്ലേ ആകുന്ന ഓഡിയോ -->
  <audio id="prankAudio" loop playsinline>
    <source src="custom_prank.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('prankAudio');
    let audioStarted = false;

    function startBoostedAudio() {
      if (audioStarted) return;
      audioStarted = true;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const src = ctx.createMediaElementSource(audio);
        const gainNode = ctx.createGain();

        gainNode.gain.value = 2.0; // ശബ്ദം ഇരട്ടിയായി ബൂസ്റ്റ് ചെയ്യാൻ
        src.connect(gainNode);
        gainNode.connect(ctx.destination);

        if (ctx.state === 'suspended') {
          ctx.resume();
        }
      } catch (e) {}

      audio.volume = 1.0;
      audio.play().catch(() => {});
    }

    window.addEventListener('DOMContentLoaded', () => {
      startBoostedAudio();
    });

    document.addEventListener('touchstart', startBoostedAudio);
    document.addEventListener('click', startBoostedAudio);

    // ബാക്ക് ബട്ടൺ ട്രാപ്പ്
    function trapBack() {
      history.pushState(null, document.title, location.href);
    }
    trapBack();
    window.addEventListener('popstate', function () {
      trapBack();
      startBoostedAudio();
    });
  </script>

</body>
</html>
