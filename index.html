<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendship Score Check</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif, Arial;
    }
    body {
      background: linear-gradient(135deg, #0b0c10, #1f2833, #0b0c10);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
      max-width: 380px;
      width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 25px;
      color: #ff3366;
      text-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
      font-weight: 700;
    }
    input[type="text"] {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid transparent;
      outline: none;
      font-size: 16px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      text-align: center;
      font-weight: bold;
      transition: 0.3s;
    }
    input[type="text"]:focus {
      border-color: #ff3366;
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(45deg, #ff3366, #ff0055);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
      transition: 0.2s;
    }
    button:active {
      transform: scale(0.97);
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Friendship Score Check</h1>
    <form onsubmit="redirectToPrank(event)">
      <input type="text" id="friendName" placeholder="നിങ്ങളുടെ ഫ്രണ്ടിന്റെ പേര് നൽകൂ..." required autocomplete="off">
      <button type="submit">Calculate Score</button>
    </form>
    <div class="footer">created by state_.trooper</div>
  </div>

  <script>
    function redirectToPrank(e) {
      e.preventDefault();
      window.location.href = "result.html";
    }
  </script>

</body>
</html>
