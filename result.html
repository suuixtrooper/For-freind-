<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaaahhhh!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* അതിവേഗ സ്ട്രോബ് ഫ്ലാഷ് */
    @keyframes seizureStrobe {
      0%   { background-color: #ffffff; }
      12%  { background-color: #ff0000; }
      25%  { background-color: #ffffff; }
      37%  { background-color: #00ff00; }
      50%  { background-color: #ffffff; }
      62%  { background-color: #0000ff; }
      75%  { background-color: #ffff00; }
      87%  { background-color: #ffffff; }
      100% { background-color: #ff00ff; }
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      animation: seizureStrobe 0.04s infinite;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .shout-text {
      font-size: clamp(65px, 20vw, 180px);
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 6px;
      text-shadow: 
        0 0 20px #ff0000,
        0 0 40px #00ffff,
        0 0 70px #ffffff,
        0 0 100px #ff00ff;
      animation: crazyVibrate 0.06s infinite alternate;
      text-align: center;
      user-select: none;
      line-height: 1;
    }

    @keyframes crazyVibrate {
      0%   { transform: translate(8px, -8px) scale(1.1) rotate(-3deg); }
      50%  { transform: translate(-8px, 8px) scale(0.9) rotate(3deg); }
      100% { transform: translate(-6px, -6px) scale(1.15) rotate(0deg); }
    }

    .footer {
      position: absolute;
      bottom: 25px;
      font-size: 14px;
      font-weight: 900;
      color: #000;
      background: #ffffff;
      padding: 8px 20px;
      border-radius: 30px;
      letter-spacing: 1.5px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="shout-text">Aaaahhhh!</div>

  <audio id="prankAudio" loop playsinline>
    <source src="custom_prank.mp3" type="audio/mpeg">
  </audio>

  <div class="footer">created by state_.trooper</div>

  <script>
    const audio = document.getElementById('prankAudio');
    let audioStarted = false;

    // 1. ഓഡിയോ സൗണ്ട് മാക്സിമം ബൂസ്റ്റ് ചെയ്യാനുള്ള വെബ് ഓഡിയോ സെറ്റപ്പ്
    function startBoostedAudio() {
      if (audioStarted) return;
      audioStarted = true;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const src = ctx.createMediaElementSource(audio);
        const gainNode = ctx.createGain();

        // ശബ്ദം ഇരട്ടിയായി ബൂസ്റ്റ് ചെയ്യാൻ (2.0 = Double Gain)
        gainNode.gain.value = 2.0; 
        src.connect(gainNode);
        gainNode.connect(ctx.destination);

        if (ctx.state === 'suspended') {
          ctx.resume();
        }
      } catch (e) {
        // സാധിച്ചില്ലെങ്കിൽ സാധാരണ രീതിയിൽ പ്ലേ ചെയ്യും
      }

      audio.volume = 1.0;
      audio.play().catch(() => {});
    }

    // ഓട്ടോമാറ്റിക് പ്ലേ ചെയ്യാൻ നോക്കുന്നു
    window.addEventListener('DOMContentLoaded', () => {
      startBoostedAudio();
    });

    // സ്ക്രീനിൽ എവിടെയെങ്കിലും തൊട്ടാൽ ഉടൻ തന്നെ സൗണ്ട് ബൂസ്റ്റ് ചെയ്ത് പ്ലേ ആകും
    document.addEventListener('touchstart', startBoostedAudio);
    document.addEventListener('click', startBoostedAudio);

    // 2. ബാക്ക് അടിച്ചാൽ പോകാതിരിക്കാൻ (Back Button Trap)
    function trapBack() {
      history.pushState(null, document.title, location.href);
    }
    
    // പേജ് ലോഡാകുമ്പോൾ ഹിസ്റ്ററിയിൽ ട്രാപ്പ് ആക്കുന്നു
    trapBack();
    window.addEventListener('popstate', function () {
      trapBack();
      startBoostedAudio(); // ബാക്ക് അടിക്കാൻ നോക്കുമ്പോഴും സൗണ്ട് ഉറപ്പാക്കുന്നു
    });

    // ടാബ് ക്ലോസ് ചെയ്യാൻ നോക്കുമ്പോൾ വാണിംഗ് കാണിക്കാൻ
    window.addEventListener('beforeunload', function (e) {
      e.preventDefault();
      e.returnValue = '';
    });
  </script>

</body>
</html>
