<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaaahhhh!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* അതിവേഗ സ്ട്രോബ് ഫ്ലാഷ് (White + Ultra RGB) */
    @keyframes seizureStrobe {
      0%   { background-color: #ffffff; }
      12%  { background-color: #ff0000; }
      25%  { background-color: #ffffff; }
      37%  { background-color: #00ff00; }
      50%  { background-color: #ffffff; }
      62%  { background-color: #0000ff; }
      75%  { background-color: #ffff00; }
      87%  { background-color: #ffffff; }
      100% { background-color: #ff00ff; }
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* 0.04 സെക്കൻഡ് - കണ്ണ് ചിമ്മുന്നതിനേക്കാൾ വേഗത്തിൽ ഫ്ലാഷ് അടിക്കും */
      animation: seizureStrobe 0.04s infinite;
      overflow: hidden;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    /* നടുവിൽ കുലുങ്ങി വിറയ്ക്കുന്ന ഭീമൻ വാചകം */
    .shout-text {
      font-size: clamp(65px, 20vw, 180px);
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 6px;
      text-shadow: 
        0 0 20px #ff0000,
        0 0 40px #00ffff,
        0 0 70px #ffffff,
        0 0 100px #ff00ff;
      animation: crazyVibrate 0.06s infinite alternate;
      text-align: center;
      line-height: 1;
    }

    @keyframes crazyVibrate {
      0%   { transform: translate(8px, -8px) scale(1.1) rotate(-3deg); }
      50%  { transform: translate(-8px, 8px) scale(0.9) rotate(3deg); }
      100% { transform: translate(-6px, -6px) scale(1.15) rotate(0deg); }
    }

    /* Aaaahhhh-ന് തൊട്ടുതാഴെയുള്ള ക്രെഡിറ്റ് ബാഡ്ജ് */
    .credit-badge {
      margin-top: 35px;
      font-size: 15px;
      font-weight: 900;
      color: #000;
      background: #ffffff;
      padding: 10px 24px;
      border-radius: 30px;
      letter-spacing: 1.5px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
      text-transform: lowercase;
    }
  </style>
</head>
<body>

  <div class="shout-text">Aaaahhhh!</div>
  <div class="credit-badge">created by state_.trooper</div>

  <!-- ഓഡിയോ എലമെന്റ് -->
  <audio id="prankAudio" preload="auto" loop playsinline>
    <source src="custom_prank.mp3" type="audio/mpeg">
    <source src="custom_prank.mp3" type="audio/mp3">
  </audio>

  <script>
    const audio = document.getElementById('prankAudio');
    let isPlaying = false;

    // ശബ്ദം പ്ലേ ചെയ്യാനും വോളിയം മാക്സിമം ആക്കാനുമുള്ള ഫംഗ്ഷൻ
    function triggerAudio() {
      if (isPlaying) return;
      audio.volume = 1.0;
      
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isPlaying = true;
        }).catch(error => {
          // ഓട്ടോപ്ലേ ബ്ലോക്കായാൽ യൂസർ തൊടുന്നത് കാത്തിരിക്കും
        });
      }
    }

    // 1. പേജിൽ കയറുമ്പോൾ തന്നെ തനിയെ ഓൺ ആക്കാൻ ശ്രമിക്കുന്നു
    window.addEventListener('DOMContentLoaded', triggerAudio);
    window.addEventListener('load', triggerAudio);

    // 2. ഏതെങ്കിലും കാരണവശാൽ ഓട്ടോപ്ലേ നടന്നില്ലെങ്കിൽ, സ്ക്രീനിൽ ഒരു തരി തൊട്ടാൽ ഉടൻ പ്ലേ ആകും
    const events = ['touchstart', 'touchend', 'mousedown', 'pointerdown', 'click', 'keydown'];
    events.forEach(event => {
      window.addEventListener(event, triggerAudio, { passive: false });
    });

    // 3. ബാക്ക് അടിച്ചാൽ പോകാതിരിക്കാനുള്ള ഹിസ്റ്ററി ട്രാപ്പ്
    function trapBack() {
      history.pushState(null, document.title, location.href);
    }
    trapBack();
    window.addEventListener('popstate', function () {
      trapBack();
      triggerAudio();
    });
  </script>

</body>
</html>
